[tasks.compile]
description = "Compile the mod with Jiangyu (override JIANGYU_DIR or JIANGYU_BUILD to point at a different local build)"
run = "dotnet ${JIANGYU_DIR:-../jiangyu}/src/Jiangyu.Cli/bin/${JIANGYU_BUILD:-Debug}/net10.0/jiangyu.dll compile"

[tasks."format:kdl"]
description = "Canonicalise every templates/*.kdl through Jiangyu's editor pipeline."
run = "dotnet ${JIANGYU_DIR:-../jiangyu}/src/Jiangyu.Cli/bin/${JIANGYU_BUILD:-Debug}/net10.0/jiangyu.dll templates format"

# JiangyuDev=true keeps the *.Dev.cs sources (dev verbs) in scope, so they are formatted/linted too.
# dotnet format takes the property from the environment, not -p:, so it is set inline here.
[tasks."format:roslyn"]
description = "Apply Roslyn whitespace, style, and analyzer fixes to runtime code and tests."
run = "JiangyuDev=true dotnet format WOMENACE.slnx"

[tasks.format]
description = "Run formatting (KDL templates + Roslyn code)."
depends = ["format:kdl", "format:roslyn"]

[tasks.lint]
description = "Verify runtime code and tests are Roslyn-clean without modifying them (fails on any drift)."
run = "JiangyuDev=true dotnet format WOMENACE.slnx --verify-no-changes"

[tasks.deploy]
description = "Deploy the compiled mod into the MENACE Mods directory (clean: removes the existing deployed folder first)"
run = "dotnet ${JIANGYU_DIR:-../jiangyu}/src/Jiangyu.Cli/bin/${JIANGYU_BUILD:-Debug}/net10.0/jiangyu.dll deploy"

[tasks.test]
description = "Compile and check Procurement behaviour, probabilities and native rendering API compatibility"
depends = ["compile"]
run = '''
set -eu
dotnet run --project tests/Procurement -- --rates
procurement_game_assemblies=$(dotnet msbuild code/WOMENACE.Code.csproj -getProperty:GameAssembliesDir)
dotnet run --project tests/ShopRendering -- compiled/code/WOMENACE.Code.dll "$procurement_game_assemblies/UnityEngine.UIElementsModule.dll"
'''
